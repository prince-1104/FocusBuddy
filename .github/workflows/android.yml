name: Android build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build app and device tests, run unit tests, and lint
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --console=plain --stacktrace
      - name: Preserve schemas and verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: persistence-verification
          retention-days: 14
          path: |
            app/schemas/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/mascot-studio.png
